<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="David De La Puente Enriquez - Kirgo -">
    <meta name="description" content="Portfolio from kirgo make it with html, css & JS">
    <meta name="keywords" content="HTML5, CSS3, JavaScript, Portfolio, carrusel">
    <!--[if IE]><meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1'><![endif]-->
    <title>KDTech Engineering | The Matrix Experience</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="./CSS/welcome/welcome.css" type="text/css" />
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Roboto:400,700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Welcome site container -->
    <div id="overlay">
        <div id="message">
            Welcome to the KDTech Matrix
        </div>
        <div id="pill-container">
            <p id="choice-message">
                Choose your path: <br>
            </p>
            <div id="pill-blue-group">
                <button id="blue-pill" onclick="elegirPastilla('azul')">
                    Blue pill
                </button>
                <p id="blue-message">
                    Enter to the real world and explore my portfolio.
                </p>
            </div>
            
            <div id="pill-red-group">
                <button id="red-pill" onclick="elegirPastilla('roja')">
                    Red pill
                </button>
                <p id="red-message">
                    Stay in the simulation and experience the illusion.
                </p>
            </div>
            
            <p class="decision-message">
                Click a pill to continue
            </p>
        </div>
    </div>
    <canvas id="matrix-canvas"></canvas>

    <script src="./JS/experiences/welcome.js"></script>
    <script>
        // Ensure both Spanish and English function names are supported by wrappers
        if (typeof elegirPastilla === 'undefined') {
            function elegirPastilla(name) {
                if (typeof choosePill !== 'undefined') return choosePill(name);
            }
        }
        if (typeof choosePill === 'undefined') {
            function choosePill(name) {
                if (typeof elegirPastilla !== 'undefined') return elegirPastilla(name);
            }
        }
    </script>
</body>

</html>
